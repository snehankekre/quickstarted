# yaml-language-server: $schema=https://snehankekre.com/quickstarted/task-schema.json
name: vite-quickstart
goal: >
  Following Vite's guide, scaffold a project in this workspace using the vanilla
  JavaScript template, then produce the production build the guide describes.
  Leave the built output in place, and do not leave a dev server running.
docs:
  # The guide scaffolds; building for production is its own page, which the
  # guide links to. A task that stops at the first page is not testing the
  # route a reader actually takes to a deployable build.
  path:
    - https://vite.dev/guide/
    - https://vite.dev/guide/build
  allow:
    - vite.dev
    - vitejs.dev
image: node:22-slim
success:
  script: |
    set -e
    # `npm create vite@latest my-app` and `npm create vite@latest .` are both
    # documented, so find the build output instead of assuming where it landed.
    built=$(find . -path ./node_modules -prune -o -name index.html -path "*/dist/*" -print | head -1)
    test -n "$built" \
      || qs_fail "no dist/index.html anywhere, so the production build never ran"
    # A Vite build rewrites the entry to a hashed asset. An unbuilt index.html
    # copied into dist/ would not.
    grep -qE '/assets/.*\.js' "$built" \
      || qs_fail "$built has no hashed /assets/*.js entry, so it was copied rather than built"
    test -n "$(find . -path ./node_modules -prune -o -path "*/dist/assets/*.js" -print | head -1)" \
      || qs_fail "$built points at /assets/ but no built JS asset exists there"
budgets:
  max_turns: 25
  max_seconds: 600
replay:
  - npm create vite@latest app -- --template vanilla
  - cd app && npm install --silent
  - cd app && npm run build
