name: fastapi-quickstart
goal: >
  Build a minimal FastAPI application in app.py exposing GET /items/42 which
  returns JSON containing an "item_id" field equal to 42. Install whatever is
  needed into the virtualenv in this workspace. Do not leave a server running;
  just make sure app.py is importable and the dependencies are installed.
docs:
  entrypoint: https://fastapi.tiangolo.com/tutorial/first-steps/
  allow:
    - fastapi.tiangolo.com
setup:
  - python3 -m venv .venv
success:
  script: |
    set -e
    test -f app.py
    # The harness decides whether it really serves: start it, ask it, stop it.
    .venv/bin/python -m uvicorn app:app --host 127.0.0.1 --port 8611 \
      > server.log 2>&1 &
    pid=$!
    # Python, not curl: the default container image ships without curl.
    .venv/bin/python - <<'PY'
    import json, sys, time, urllib.request
    for _ in range(40):
        time.sleep(1)
        try:
            with urllib.request.urlopen("http://127.0.0.1:8611/items/42", timeout=5) as r:
                if json.load(r).get("item_id") == 42:
                    sys.exit(0)
        except Exception:
            continue
    sys.exit(1)
    PY
    status=$?
    kill "$pid" 2>/dev/null || true
    exit $status
budgets:
  max_turns: 20
  max_seconds: 480
replay:
  - .venv/bin/pip install --quiet "fastapi[standard]"
  - |
    cat > app.py <<'PY'
    from fastapi import FastAPI

    app = FastAPI()


    @app.get("/items/{item_id}")
    async def read_item(item_id: int):
        return {"item_id": item_id}
    PY
