site_name: quickstarted
site_description: Test whether an AI agent can complete your quickstart using only your docs.
site_url: https://snehankekre.com/quickstarted/
repo_url: https://github.com/snehankekre/quickstarted
repo_name: snehankekre/quickstarted
edit_uri: edit/main/docs/
copyright: MIT licensed

theme:
  name: material
  # Faces a devtools reader already reads. Novelty in type costs more than it
  # returns on a documentation site, and the numbers in these pages are the
  # point, so the mono face has to be one that lines them up.
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.instant
    - navigation.instant.progress
    - navigation.footer
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.tabs.link
    - search.suggest
    - search.highlight
    - toc.follow
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Light mode

extra_css:
  - stylesheets/quickstarted.css

# Every page is also served as raw Markdown, and llms.txt is generated from the
# nav below. A tool that tests documentation for agents should be legible to
# one.
hooks:
  - docs_hooks.py

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  # Required by the `markdown` attribute on the grid cards in index.md.
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets

nav:
  - Home: index.md
  - Getting started:
      - Install: getting-started/install.md
      - Your first run: getting-started/first-run.md
      - Agent mode in depth: getting-started/agent-mode.md
  - Guides:
      - Writing tasks: guides/writing-tasks.md
      - Replay mode: guides/replay-mode.md
      - Sandboxing: guides/sandboxing.md
      - Pass rates: guides/pass-rates.md
      - Measuring llms.txt: guides/affordances.md
      - Running in CI: guides/ci.md
      - Cost and budgets: guides/cost.md
  - Reference:
      - CLI: reference/cli.md
      - Task schema: reference/task-schema.md
      - Results schema: reference/results.md
      - Trace events: reference/trace.md
      - Environment variables: reference/environment.md
  - Why it works this way:
      - Deterministic scoring: explanation/scoring.md
      - The egress proxy: explanation/proxy.md
      - Compared to other tools: explanation/comparison.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/snehankekre/quickstarted
