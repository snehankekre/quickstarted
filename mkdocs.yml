site_name: quickstarted
site_description: Test whether an AI agent can complete your quickstart using only your docs.
site_url: https://snehankekre.com/quickstarted/
repo_url: https://github.com/snehankekre/quickstarted
repo_name: snehankekre/quickstarted
edit_uri: edit/main/docs/
copyright: MIT licensed

theme:
  name: material
  # Serif prose, mono structure, which is the system snehankekre.com already
  # uses and this site is served from a path underneath it. Source Serif 4 is
  # drawn for screens and holds up at body size; JetBrains Mono is tabular by
  # default, and half of these pages are numbers that have to line up.
  font:
    text: Source Serif 4
    code: JetBrains Mono
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.instant
    - navigation.instant.progress
    - navigation.footer
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.tabs.link
    - search.suggest
    - search.highlight
    - toc.follow
  icon:
    repo: fontawesome/brands/github
  # Colours are set in stylesheets/quickstarted.css rather than picked from
  # Material's named list. Green and red already mean pass and fail in every
  # console sample on this site, so the accent has to stay out of their lane.
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light mode

extra_css:
  - stylesheets/quickstarted.css

# Every page is also served as raw Markdown, and llms.txt is generated from the
# nav below. A tool that tests documentation for agents should be legible to
# one.
hooks:
  - docs_hooks.py

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  # Required by the `markdown` attribute on the grid cards in index.md.
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      # Puts `language-*` on the wrapper, which is what lets the stylesheet
      # tell a command you type from output the tool printed. An untagged
      # fence lands in `language-text`, and every untagged fence on this site
      # is a console sample.
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets

nav:
  - Home: index.md
  - Getting started:
      - Install: getting-started/install.md
      - Your first run: getting-started/first-run.md
      - Agent mode in depth: getting-started/agent-mode.md
  - Guides:
      - Writing tasks: guides/writing-tasks.md
      - Replay mode: guides/replay-mode.md
      - Sandboxing: guides/sandboxing.md
      - Pass rates: guides/pass-rates.md
      - Measuring llms.txt: guides/affordances.md
      - Running in CI: guides/ci.md
      - Cost and budgets: guides/cost.md
  - Reference:
      - CLI: reference/cli.md
      - Task schema: reference/task-schema.md
      - Results schema: reference/results.md
      - Trace events: reference/trace.md
      - Environment variables: reference/environment.md
  - Why it works this way:
      - Deterministic scoring: explanation/scoring.md
      - Testing the quickstart, not your idea of it: explanation/fidelity.md
      - The egress proxy: explanation/proxy.md
      - Compared to other tools: explanation/comparison.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/snehankekre/quickstarted
