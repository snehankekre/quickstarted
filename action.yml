name: quickstarted
description: >
  Run quickstarted tasks against your documentation. Replay mode is free and
  needs no API key; agent mode needs QUICKSTARTED_ANTHROPIC_API_KEY (or
  ANTHROPIC_API_KEY) in env.
branding:
  icon: check-circle
  color: green

inputs:
  tasks:
    description: >
      Space-separated task files, a directory, or a glob. Leave empty to run
      every task in tasks/.
    required: false
    default: ""
  agent:
    description: replay, claude, openai, or gemini
    required: false
    default: replay
  model:
    description: Model override for LLM agents (required for openai and gemini)
    required: false
    default: ""
  repeat:
    description: Attempts per task; more than one reports a pass rate
    required: false
    default: "1"
  workers:
    description: Attempts to run in parallel
    required: false
    default: "1"
  backend:
    description: Execution backend; docker is the enforced one on Linux runners
    required: false
    default: docker
  image:
    description: >
      Container image for tasks that do not name their own. The default
      python:3.12-slim has no Node.
    required: false
    default: ""
  affordances:
    description: "all (default) or none, to withhold llms.txt and .md variants"
    required: false
    default: all
  probe-affordances:
    description: Record which machine-facing files exist (context, never scored)
    required: false
    default: "false"
  cache-dir:
    description: >
      Content-addressed documentation cache. Point actions/cache at it and
      reruns read the same bytes, which is what makes two runs comparable.
    required: false
    default: ""
  prices:
    description: Path to a price book JSON file, for cost estimates
    required: false
    default: ""
  max-spend:
    description: Stop once the estimated cost reaches this many dollars
    required: false
    default: ""
  python-version:
    description: Python version to run with
    required: false
    default: "3.12"
  working-directory:
    description: Directory to run in, for a monorepo whose docs live in a subtree
    required: false
    default: "."
  out:
    description: Directory for traces and reports
    required: false
    default: quickstarted-results
  junit:
    description: Path for a JUnit XML report (empty to skip)
    required: false
    default: ""
  github-summary:
    description: Append the markdown report to the job summary
    required: false
    default: "true"
  strict-inconclusive:
    description: >
      Fail the job when any run produced no evidence. Off by default, because a
      rate limit is not a broken quickstart.
    required: false
    default: "false"
  allow-unenforced:
    description: >
      Permit the local backend, whose network policy is advisory. Only for tasks
      and projects you wrote yourself.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install quickstarted
      shell: bash
      run: |
        case "${{ inputs.agent }}" in
          claude) pip install "quickstarted[claude,prices]" ;;
          openai) pip install "quickstarted[openai,prices]" ;;
          gemini) pip install "quickstarted[gemini,prices]" ;;
          *)      pip install quickstarted ;;
        esac
    - name: Report what this runner can enforce
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: quickstarted doctor
    - name: Run tasks
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        files="${{ inputs.tasks }}"
        args=(run $files
          --agent "${{ inputs.agent }}"
          --backend "${{ inputs.backend }}"
          --repeat "${{ inputs.repeat }}"
          --workers "${{ inputs.workers }}"
          --affordances "${{ inputs.affordances }}"
          --out "${{ inputs.out }}")
        if [ -n "${{ inputs.model }}" ]; then args+=(--model "${{ inputs.model }}"); fi
        if [ -n "${{ inputs.junit }}" ]; then args+=(--junit "${{ inputs.junit }}"); fi
        if [ -n "${{ inputs.image }}" ]; then args+=(--image "${{ inputs.image }}"); fi
        if [ -n "${{ inputs.cache-dir }}" ]; then args+=(--cache-dir "${{ inputs.cache-dir }}"); fi
        if [ -n "${{ inputs.prices }}" ]; then args+=(--prices "${{ inputs.prices }}"); fi
        if [ -n "${{ inputs.max-spend }}" ]; then args+=(--max-spend "${{ inputs.max-spend }}"); fi
        if [ "${{ inputs.probe-affordances }}" = "true" ]; then args+=(--probe-affordances); fi
        if [ "${{ inputs.github-summary }}" = "true" ]; then args+=(--github-summary); fi
        if [ "${{ inputs.strict-inconclusive }}" = "true" ]; then args+=(--strict-inconclusive); fi
        if [ "${{ inputs.allow-unenforced }}" = "true" ]; then args+=(--allow-unenforced); fi
        quickstarted "${args[@]}"
