# yaml-language-server: $schema=https://snehankekre.com/quickstarted/task-schema.json
name: tailwind-quickstart
goal: >
  Follow Tailwind CSS's installation guide for the Tailwind CLI, all the way to
  the HTML it ends with, using the file names and the example markup the guide
  uses. Build your CSS once rather than leaving the watcher running.
image: node:22-slim
docs:
  # The CLI page, not /docs/installation. That one leads with the Vite plugin,
  # whose documented step is `npm run dev`, a watcher this sandbox cannot leave
  # running. Pointing a task at a page and then forbidding what it says to do
  # scores the harness's constraint as a documentation failure.
  path:
    - https://tailwindcss.com/docs/installation/tailwind-cli
  allow:
    - tailwindcss.com
success:
  script: |
    set -e
    test -f src/index.html \
      || qs_fail "no src/index.html, so the guide's last step never happened"
    test -f src/output.css \
      || qs_fail "no src/output.css, so the CLI build never produced a stylesheet"
    for class in text-3xl font-bold underline; do
      grep -q -- "$class" src/index.html \
        || qs_fail "src/index.html does not use the documented class $class"
    done
    # Tailwind only emits a utility it saw used, so finding these rules proves
    # the build actually scanned the HTML rather than emitting a default sheet.
    node -e '
      const css = require("fs").readFileSync("src/output.css", "utf8");
      for (const cls of ["text-3xl", "font-bold", "underline"]) {
        if (!css.includes("." + cls)) {
          console.log("check failed: src/output.css has no rule for ." + cls +
            ", so the build did not scan src/index.html");
          process.exit(1);
        }
      }
    '
budgets:
  max_turns: 25
  max_seconds: 600
replay:
  - npm init -y --silent
  - npm install --silent tailwindcss @tailwindcss/cli
  - mkdir -p src
  - printf '@import "tailwindcss";\n' > src/input.css
  - |
    cat > src/index.html <<'HTML'
    <!doctype html>
    <html>
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <link href="./output.css" rel="stylesheet">
    </head>
    <body>
      <h1 class="text-3xl font-bold underline">
        Hello world!
      </h1>
    </body>
    </html>
    HTML
  # The documented command ends in --watch, which would never return. Dropping
  # that one flag is the only change; everything else is the guide's own line.
  - npx @tailwindcss/cli -i ./src/input.css -o ./src/output.css
