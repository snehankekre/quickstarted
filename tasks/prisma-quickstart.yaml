# yaml-language-server: $schema=https://snehankekre.com/quickstarted/task-schema.json
name: prisma-quickstart
goal: >
  Work through Prisma's SQLite quickstart in this workspace: set up the project,
  define the models it defines, apply them to the database, then write and run
  the script it ends with, which creates the user and post it creates and prints
  every user back with their posts.
image: node:22-slim
docs:
  path:
    - https://www.prisma.io/docs/getting-started/quickstart-sqlite
  allow:
    - prisma.io
network:
  allow:
    # Prisma downloads its query engine binaries at generate time. Without this
    # the run fails on a download, which says nothing about the documentation.
    - binaries.prisma.sh
success:
  # The quickstart's own ending is two console.log calls, not a file. Asserting
  # a file here would mean inventing one the documentation never mentions and
  # then testing the invention.
  expect_output:
    contains:
      - alice@prisma.io
      - Hello World
  script: |
    set -e
    test -n "$(find . -path ./node_modules -prune -o -name schema.prisma -print | head -1)" \
      || qs_fail "no schema.prisma, so nothing came from Prisma"
    db=$(find . -path ./node_modules -prune -o -name "*.db" -print | head -1)
    test -n "$db" || qs_fail "no .db file, so nothing was stored in SQLite"
    # The row has to be in the database, not only on the terminal. SQLite keeps
    # short text inline in the page, so the file itself carries the evidence
    # without needing a driver this image may not have.
    grep -qa "alice@prisma.io" "$db" \
      || qs_fail "$db does not contain alice@prisma.io, so the user was never persisted"
budgets:
  max_turns: 35
  max_seconds: 900
replay:
  # Verified against Prisma 7.9. v7 is a redesign: the datasource URL moved to
  # prisma.config.ts, the generated client is TypeScript, and a driver adapter
  # is mandatory. Any of those three can strand a reader.
  - npm init -y --silent
  - npm install --silent prisma @prisma/client tsx @prisma/adapter-better-sqlite3
  - npx prisma init --datasource-provider sqlite
  - |
    cat >> prisma/schema.prisma <<'PRISMA'

    model User {
      id    Int     @id @default(autoincrement())
      email String  @unique
      name  String?
      posts Post[]
    }

    model Post {
      id        Int     @id @default(autoincrement())
      title     String
      content   String?
      published Boolean @default(false)
      author    User    @relation(fields: [authorId], references: [id])
      authorId  Int
    }
    PRISMA
  - npx prisma migrate dev --name init
  - npx prisma generate
  - |
    cat > script.ts <<'TS'
    import { PrismaBetterSqlite3 } from "@prisma/adapter-better-sqlite3";
    import { PrismaClient } from "./generated/prisma/client.js";

    const adapter = new PrismaBetterSqlite3({ url: "file:./dev.db" });
    const prisma = new PrismaClient({ adapter });

    async function main() {
      const user = await prisma.user.create({
        data: {
          name: "Alice",
          email: "alice@prisma.io",
          posts: {
            create: {
              title: "Hello World",
              content: "This is my first post!",
              published: true,
            },
          },
        },
        include: { posts: true },
      });
      console.log("Created user:", user);

      const allUsers = await prisma.user.findMany({ include: { posts: true } });
      console.log("All users:", JSON.stringify(allUsers, null, 2));
    }

    main().finally(() => prisma.$disconnect());
    TS
  - npx tsx script.ts
