# yaml-language-server: $schema=https://snehankekre.com/quickstarted/task-schema.json
name: django-quickstart
goal: >
  Work through part 1 of the Django tutorial in this workspace: install Django,
  create the project and the app it creates, and write the first view exactly as
  the tutorial writes it, wired to the URL path the tutorial wires it to. Do not
  leave a development server running.
docs:
  # Install first, then part 1, which is the order the tutorial itself gives:
  # part 1 opens by checking Django is already installed and links back here.
  path:
    - https://docs.djangoproject.com/en/stable/intro/install/
    - https://docs.djangoproject.com/en/stable/intro/tutorial01/
  allow:
    - docs.djangoproject.com
    - djangoproject.com
setup:
  - python3 -m venv .venv
success:
  script: |
    set -e
    WS="$PWD"
    # The tutorial runs `startproject mysite djangotutorial`, so manage.py sits
    # one level down; `startproject mysite .` is documented elsewhere. Find it
    # rather than assuming either.
    manage=$(find . -name manage.py -not -path "./.venv/*" | head -1)
    test -n "$manage" \
      || qs_fail "no manage.py anywhere, so startproject never ran"
    root=$(dirname "$manage")
    test -d "$root/polls" \
      || qs_fail "no polls app beside $manage, so startapp never ran"
    cd "$root"
    "$WS/.venv/bin/python" manage.py check
    # Ask the view, through Django's own test client, so no server is needed.
    "$WS/.venv/bin/python" - <<'PY'
    import os, sys, django
    from pathlib import Path
    sys.path.insert(0, os.getcwd())
    settings = next(p for p in Path(".").glob("*/settings.py"))
    os.environ["DJANGO_SETTINGS_MODULE"] = f"{settings.parent.name}.settings"
    django.setup()
    # Outside a test runner ALLOWED_HOSTS is enforced, and the test client's
    # SERVER_NAME is 'testserver', so without this every request is a 400.
    from django.conf import settings as conf
    conf.ALLOWED_HOSTS = ["testserver", "localhost", "127.0.0.1"]
    from django.test import Client
    response = Client().get("/polls/")
    body = response.content.decode()
    assert response.status_code == 200, (response.status_code, body[:400])
    # The tutorial's own string. Asserting a shortened version would pass for a
    # view the tutorial never told anyone to write.
    assert "Hello, world. You're at the polls index." in body, body[:400]
    PY
budgets:
  max_turns: 30
  max_seconds: 720
replay:
  - .venv/bin/pip install --quiet django
  - .venv/bin/django-admin startproject mysite djangotutorial
  - cd djangotutorial && ../.venv/bin/python manage.py startapp polls
  - |
    cat > djangotutorial/polls/views.py <<'PY'
    from django.http import HttpResponse


    def index(request):
        return HttpResponse("Hello, world. You're at the polls index.")
    PY
  - |
    cat > djangotutorial/polls/urls.py <<'PY'
    from django.urls import path

    from . import views

    urlpatterns = [
        path("", views.index, name="index"),
    ]
    PY
  - |
    cat > djangotutorial/mysite/urls.py <<'PY'
    from django.contrib import admin
    from django.urls import include, path

    urlpatterns = [
        path("polls/", include("polls.urls")),
        path("admin/", admin.site.urls),
    ]
    PY
  - cd djangotutorial && ../.venv/bin/python manage.py check
