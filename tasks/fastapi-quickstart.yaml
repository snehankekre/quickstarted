# yaml-language-server: $schema=https://snehankekre.com/quickstarted/task-schema.json
name: fastapi-quickstart
goal: >
  Following the FastAPI tutorial, install FastAPI into this workspace and copy
  the tutorial's first example application into the file the tutorial names, so
  that a GET request to / answers with the JSON the tutorial shows. Do not
  leave a server running; the harness starts one itself.
docs:
  # Two pages, in the tutorial's own order. The install instruction is on the
  # index and the first application is on first-steps, so an agent that lands on
  # first-steps alone never sees how to install anything. Three benchmark runs
  # failed exactly there, and the harness recorded a documentation gap against a
  # page that is not missing anything.
  path:
    - https://fastapi.tiangolo.com/tutorial/
    - https://fastapi.tiangolo.com/tutorial/first-steps/
  allow:
    - fastapi.tiangolo.com
success:
  # A shell file rather than the declarative form: the check has to choose
  # between two documented ways of serving, which `serve:` cannot express.
  file: checks/fastapi.sh
budgets:
  max_turns: 20
  max_seconds: 480
replay:
  - python3 -m venv .venv
  - .venv/bin/pip install --quiet "fastapi[standard]"
  - |
    cat > main.py <<'PY'
    from fastapi import FastAPI

    app = FastAPI()


    @app.get("/")
    async def root():
        return {"message": "Hello World"}
    PY
