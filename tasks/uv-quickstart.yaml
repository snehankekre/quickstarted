# yaml-language-server: $schema=https://snehankekre.com/quickstarted/task-schema.json
name: uv-quickstart
goal: >
  Following uv's documentation, install uv, create the example project its
  project guide creates, run that project so it prints the greeting the guide
  shows, and then add the dependency the guide adds. uv's standalone installer
  script is not reachable from this sandbox, so use one of the other installation
  methods the documentation lists.
docs:
  # Installation first, then the project guide, which is the order the
  # documentation itself puts them in. The old entrypoint,
  # /uv/getting-started/, is a hub page: four links and no commands.
  path:
    - https://docs.astral.sh/uv/getting-started/installation/
    - https://docs.astral.sh/uv/guides/projects/
  allow:
    - docs.astral.sh
# `astral.sh` is deliberately absent from network.allow. Allowing it would also
# allow `docs.astral.sh` (the match is by suffix), and a shell that can reach a
# documentation host is the hole that makes page attribution unprovable. The
# documentation lists pip and pipx alongside the installer, so a reader in this
# position still has a documented route, which is what the goal points at.
success:
  # `uv run hello-world` printing this line is the guide's own promise.
  expect_output:
    contains: Hello from hello-world!
  script: |
    set -e
    # Test the find result, not the dirname of it: `dirname ""` prints `.` and
    # exits 0, so the guard never fired and an empty workspace reported the
    # next failure instead, naming a file that does not exist.
    manifest=$(find . -name pyproject.toml -not -path "*/.venv/*" | head -1)
    test -n "$manifest" \
      || qs_fail "no pyproject.toml anywhere, so uv init never created a project"
    root=$(dirname "$manifest")
    test -f "$root/uv.lock" \
      || qs_fail "no uv.lock beside pyproject.toml, so the project was never locked"
    grep -q requests "$root/pyproject.toml" \
      || qs_fail "requests is not a dependency in $root/pyproject.toml"
    # Find the interpreter uv built rather than naming .venv. uv puts it there
    # today, but nothing in the goal told the agent that, and a check that
    # asserts an undocumented path fails runs that did everything right.
    # No -type f: uv's interpreter is a symlink to the real one.
    py=$(find "$root" -maxdepth 3 -path "*/bin/python" | head -1)
    test -n "$py" \
      || qs_fail "no project environment under $root, so uv never built one"
    "$py" -c "import requests" \
      || qs_fail "requests is not importable from the environment uv built"
budgets:
  max_turns: 25
  max_seconds: 600
replay:
  - python3 -m venv .tools
  - .tools/bin/pip install --quiet uv
  - .tools/bin/uv init hello-world
  - cd hello-world && ../.tools/bin/uv run hello-world
  - cd hello-world && ../.tools/bin/uv add requests
