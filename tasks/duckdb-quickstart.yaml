# yaml-language-server: $schema=https://snehankekre.com/quickstarted/task-schema.json
name: duckdb-quickstart
goal: >
  Following the DuckDB Python documentation, install DuckDB and work through its
  persistent storage example: connect to the database file it names, create the
  table it describes, insert the value it inserts, and print the table's
  contents.
docs:
  # duckdb.org answers this URL with a client-side redirect stub whose entire
  # text is "Redirecting…". The harness follows it now; before it did, every
  # agent read 73 characters of nothing here and the run was scored as a
  # documentation gap.
  path:
    - https://duckdb.org/docs/stable/clients/python/overview
  allow:
    - duckdb.org
setup:
  - python3 -m venv .venv
success:
  # What the documented example promises is a number on a terminal.
  expect_output:
    contains: "42"
  script: |
    set -e
    test -f file.db \
      || qs_fail "no file.db, so no connection was made to a persistent database"
    # And it has to have survived in the file, not only on the terminal.
    .venv/bin/python - <<'PY'
    import duckdb
    con = duckdb.connect("file.db", read_only=True)
    rows = con.execute("select i from test").fetchall()
    assert rows == [(42,)], rows
    PY
budgets:
  max_turns: 20
  max_seconds: 420
replay:
  - .venv/bin/pip install --quiet duckdb
  - |
    cat > example.py <<'PY'
    import duckdb

    # create a connection to a file called 'file.db'
    con = duckdb.connect("file.db")
    # create a table and load data into it
    con.sql("CREATE TABLE test (i INTEGER)")
    con.sql("INSERT INTO test VALUES (42)")
    # query the table
    con.table("test").show()
    # explicitly close the connection
    con.close()
    PY
  - .venv/bin/python example.py
