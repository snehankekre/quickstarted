# yaml-language-server: $schema=https://snehankekre.com/quickstarted/task-schema.json
name: httpx-quickstart
goal: >
  Following the HTTPX documentation, install httpx into this workspace and make
  the GET request its front page opens with, against the same URL it uses, then
  print the response's status code.
docs:
  path:
    - https://www.python-httpx.org/
    - https://www.python-httpx.org/quickstart/
  allow:
    - python-httpx.org
network:
  # The front page's own example fetches example.org. The shell cannot reach
  # documentation hosts by design, but this is not one: it is the URL the
  # documentation tells a reader to request, so refusing it would fail the task
  # on harness policy and read like a documentation gap.
  allow:
    - example.org
setup:
  - python3 -m venv .venv
success:
  # The documented session ends at `r.status_code` showing 200. There is no
  # file to assert on, because the documentation never asks for one.
  expect_output:
    matches: "(^|[^0-9])200([^0-9]|$)"
  script: |
    set -e
    .venv/bin/python -c "import httpx" \
      || qs_fail "httpx is not installed in the workspace environment"
budgets:
  max_turns: 15
  max_seconds: 600
replay:
  - .venv/bin/pip install --quiet httpx
  - |
    cat > example.py <<'PY'
    import httpx

    r = httpx.get("https://www.example.org/")
    print(r)
    print(r.status_code)
    PY
  - .venv/bin/python example.py
