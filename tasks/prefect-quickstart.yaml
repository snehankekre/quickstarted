name: prefect-quickstart
goal: >
  Install Prefect into the virtualenv in this workspace and write flow.py, which
  defines a Prefect flow that reads numbers.txt from this workspace (one integer
  per line), sums them, and writes the total to total.txt as a single number.
  Run the flow locally. Do not start a Prefect server, and do not log in to
  Prefect Cloud.
docs:
  entrypoint: https://docs.prefect.io/v3/get-started/quickstart
  allow:
    - docs.prefect.io
    - prefect.io
setup:
  - python3 -m venv .venv
  - printf '4\n8\n15\n16\n23\n42\n' > numbers.txt
success:
  script: |
    set -e
    test -f flow.py
    test -f total.txt
    # The flow has to be a Prefect flow, not a plain function that happens to
    # produce the right number.
    grep -q "@flow" flow.py
    .venv/bin/python -c "import prefect"
    # Assert the arithmetic, so any correct route through the API passes.
    test "$(tr -d '[:space:]' < total.txt)" = "108"
budgets:
  max_turns: 25
  max_seconds: 600
replay:
  - .venv/bin/pip install --quiet prefect
  - |
    cat > flow.py <<'PY'
    from prefect import flow, task


    @task
    def read_numbers(path: str) -> list[int]:
        with open(path) as fh:
            return [int(line) for line in fh if line.strip()]


    @flow
    def total_flow() -> int:
        numbers = read_numbers("numbers.txt")
        total = sum(numbers)
        with open("total.txt", "w") as fh:
            fh.write(str(total))
        return total


    if __name__ == "__main__":
        total_flow()
    PY
  - .venv/bin/python flow.py
