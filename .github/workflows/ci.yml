name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy

  test:
    strategy:
      fail-fast: false
      matrix:
        # macOS is not incidental: the Seatbelt backend only exists there, and
        # its enforcement tests are the ones that matter most.
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest --cov=quickstarted --cov-report=term-missing
      - name: Network-gated enforcement tests
        if: runner.os == 'macOS'
        env:
          QUICKSTARTED_NETWORK_TESTS: "1"
        run: pytest tests/test_exec.py -q

  dogfood:
    # The tool tests its own quickstart, in replay mode, with no API key.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "."
      - run: quickstarted doctor
      - run: quickstarted validate journeys/*.yaml
      - name: Run replay journeys
        run: |
          quickstarted run journeys/pnf-quickstart.yaml \
            --agent replay --backend docker --out results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quickstarted-results
          path: results/
