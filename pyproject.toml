[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quickstarted"
version = "0.4.0"
description = "Test whether an AI agent can complete your quickstart using only your docs"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "snehan", email = "snehan.minerva@gmail.com" }]
keywords = ["docs", "documentation", "agents", "testing", "ci", "devrel", "agent-experience"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Documentation",
]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
claude = ["anthropic>=0.40"]
openai = ["openai>=1.40"]
gemini = ["google-genai>=1.0"]
# Live rates, so a run reports dollars without a hand-written price book.
prices = ["genai-prices>=0.0.72"]
all-agents = ["anthropic>=0.40", "openai>=1.40", "google-genai>=1.0"]
docs = [
    "mkdocs-material>=9.5",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    # All three vendor SDKs, so type checking sees what a developer sees.
    "anthropic>=0.40",
    "openai>=1.40",
    "google-genai>=1.0",
    "genai-prices>=0.0.72",
]

[project.scripts]
quickstarted = "quickstarted.cli:main"
# Short alias: the full name is a mouthful to type in a loop.
qstart = "quickstarted.cli:main"

[project.urls]
Homepage = "https://github.com/snehankekre/quickstarted"
Issues = "https://github.com/snehankekre/quickstarted/issues"
Changelog = "https://github.com/snehankekre/quickstarted/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/tasks",
    "/docs",
    "/mkdocs.yml",
    "/docs_hooks.py",
    "/README.md",
    "/LICENSE",
    "/DESIGN.md",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/SECURITY.md",
    "/RELEASING.md",
]

[tool.hatch.build.targets.wheel]
packages = ["src/quickstarted"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:quickstarted.*"]

[tool.coverage.run]
source = ["quickstarted"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[tool.ruff]
line-length = 95
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    # The vendor adapters really do need to catch anything: each SDK raises a
    # different taxonomy and a benchmark must not die on an unknown subclass.
    "BLE001",
]

[tool.ruff.lint.per-file-ignores]
# Tests read better with long literal fixtures and local imports.
"tests/*" = ["E501"]
# The sidecar entrypoint imports after a deliberate sys.path edit.
"src/quickstarted/net/proxy_main.py" = ["E402"]
# The check helpers are a shell script in a string literal; wrapping a pipeline
# to satisfy a Python line limit would make the shell harder to read.
"src/quickstarted/checks.py" = ["E501"]

[tool.mypy]
# The package supports 3.9 at runtime; mypy itself no longer targets it,
# and CI runs the test matrix down to 3.9 to cover the gap.
python_version = "3.10"
files = ["src/quickstarted"]
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true
